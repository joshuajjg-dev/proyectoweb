{% extends 'base.html' %}

{% block content %}
<div class="login-container">
    <h2>Iniciar Sesión</h2> <!--[cite: 2] -->
    <form action="" method="POST">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required> <!--[cite: 2] -->
        
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
        
        <button type="submit" class="btn">Ingresar</button> <!--[cite: 2] -->
    </form>
    <a href="{% url 'home:registro' %}">¿No tienes cuenta? Regístrate</a>
</div>
{% endblock content %}
