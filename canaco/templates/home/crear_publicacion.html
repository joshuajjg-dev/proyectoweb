{% extends 'base.html' %}

{% block content %}
<div class="container my-5 animate__animated animate__fadeIn" style="max-width: 850px;">
    <div class="card card-custom p-4 shadow-sm border-0">
        <h3 class="fw-bold text-dark mb-1">
            <i class="fa-solid fa-pen-to-square text-primary me-2"></i>
            {% if publicacion %}Editar Publicación{% else %}Nueva Publicación{% endif %}
        </h3>
        <p class="text-muted small mb-4">Llena los detalles completos para la noticia del portal.</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Título de la Noticia *</label>
                <input type="text" name="titulo" class="form-control form-control-lg" value="{{ publicacion.titulo|default:'' }}" placeholder="Escribe un título atractivo" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Categoría</label>
                    <select name="categoria" class="form-select">
                        <option value="">-- Seleccionar Categoría --</option>
                        {% for cat in categorias %}
                            <option value="{{ cat.id }}" {% if publicacion.categoria_id == cat.id %}selected{% endif %}>{{ cat.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Estado de Publicación</label>
                    <select name="estado" class="form-select">
                        <option value="borrador" {% if publicacion.estado == 'borrador' %}selected{% endif %}>Borrador (Oculto)</option>
                        <option value="publicado" {% if publicacion.estado == 'publicado' %}selected{% endif %}>Publicado (Visible)</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Resumen o Entrada Breve</label>
                <textarea name="resumen" class="form-control" rows="2" placeholder="Un breve resumen que aparecerá en el inicio...">{{ publicacion.resumen|default:'' }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Contenido Completo *</label>
                <textarea name="contenido" class="form-control" rows="8" placeholder="Escribe el cuerpo principal de la noticia..." required>{{ publicacion.contenido|default:'' }}</textarea>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Imagen de Portada</label>
                    <input type="file" name="imagen_portada" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Imágenes para Galería (Opcional)</label>
                    <input type="file" name="galeria" class="form-control" multiple>
                </div>
            </div>

            <div class="d-flex justify-content-between pt-3 border-top">
                <a href="{% url 'home:crud_noticias' %}" class="btn btn-light rounded-pill px-4 fw-semibold">Cancelar</a>
                <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">Guardar Publicación</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
