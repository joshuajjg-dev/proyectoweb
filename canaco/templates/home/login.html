{% extends 'base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 450px;">
    <div class="card card-custom p-4 shadow-lg border-0 animate__animated animate__fadeIn">
        <div class="text-center mb-4">
            <div class="rounded-circle bg-soft-info text-primary d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Iniciar Sesión</h3>
            <p class="text-muted small">Ingresa tus credenciales para acceder al sistema CANACO.</p>
        </div>

        <form method="POST" action="">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Tu usuario" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">Ingresar al Portal</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <span class="small text-muted">¿No tienes una cuenta aún? </span>
            <a href="{% url 'home:registro' %}" class="small fw-bold text-primary text-decoration-none">Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock content %}
